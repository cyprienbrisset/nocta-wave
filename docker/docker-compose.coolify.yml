# =============================================================================
# WS-Flows - Docker Compose for Coolify
# =============================================================================
#
# DÉPLOIEMENT SUR COOLIFY:
# ========================
#
# 1. Dans Coolify, créer un nouveau projet "WS-Flows"
#
# 2. Ajouter une ressource → "Docker Compose"
#    - Source: Connecter votre repo Git
#    - Docker Compose Location: docker/docker-compose.coolify.yml
#
# 3. Configurer les VARIABLES D'ENVIRONNEMENT (Environment Variables):
#
#    # Sécurité (OBLIGATOIRE - générer des valeurs uniques)
#    JWT_SECRET=<générer: openssl rand -base64 64>
#    REFRESH_TOKEN_SECRET=<générer: openssl rand -base64 64>
#    ENCRYPTION_KEY=<générer: openssl rand -hex 32>
#
#    # Admin (OBLIGATOIRE - changez le mot de passe!)
#    ADMIN_PASSWORD=votre-mot-de-passe-admin-securise
#
#    # URLs (adapter à vos domaines Coolify)
#    CORS_ORIGIN=https://wsflows.votre-domaine.com
#    NEXT_PUBLIC_API_URL=https://api.wsflows.votre-domaine.com
#
# 4. Configurer les DOMAINES dans Coolify:
#    - Service "web"  → wsflows.votre-domaine.com (port 3000)
#    - Service "api"  → api.wsflows.votre-domaine.com (port 3001)
#
# 5. Déployer!
#
# CREDENTIALS PAR DÉFAUT:
# =======================
# Email:    admin@wsflows.local
# Password: (voir variable ADMIN_PASSWORD, défaut: admin123)
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wsflows
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wsflows-db-password-change-me}
      POSTGRES_DB: wsflows
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wsflows -d wsflows']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - wsflows-network

  # ---------------------------------------------------------------------------
  # Redis Cache & Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    command: redis-server --appendonly yes
    networks:
      - wsflows-network

  # ---------------------------------------------------------------------------
  # API Backend (NestJS)
  # Migrations et Seed sont exécutés automatiquement au démarrage
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      # Database
      DATABASE_URL: postgresql://wsflows:${POSTGRES_PASSWORD:-wsflows-db-password-change-me}@postgres:5432/wsflows
      # Redis
      REDIS_URL: redis://redis:6379
      # Auth - IMPORTANT: Générer des secrets uniques!
      JWT_SECRET: ${JWT_SECRET:-CHANGE-ME-jwt-secret-at-least-32-characters-long-and-random}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-CHANGE-ME-refresh-token-secret-32-chars-random}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      # Encryption - IMPORTANT: Générer une clé unique!
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-CHANGE-ME-encryption-key-32-characters}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Admin password for seed
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - wsflows-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Web Frontend (Next.js)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:3001}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: always
    networks:
      - wsflows-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# =============================================================================
# Volumes (persistants)
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  wsflows-network:
    driver: bridge
