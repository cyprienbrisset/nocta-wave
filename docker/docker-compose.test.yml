# =============================================================================
# WS-Flows - Docker Compose for E2E Testing
# =============================================================================
#
# Usage:
#   docker compose -f docker/docker-compose.test.yml up -d
#   pnpm test:e2e
#   docker compose -f docker/docker-compose.test.yml down -v
#
# This creates isolated test containers with separate ports and volumes.
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Test Database
  # ---------------------------------------------------------------------------
  postgres-test:
    image: postgres:16-alpine
    container_name: wsflows-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wsflows_test
    ports:
      - '5435:5432'
    tmpfs:
      - /var/lib/postgresql/data # Use RAM for faster tests
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 10
    restart: 'no'

  # ---------------------------------------------------------------------------
  # Redis Test Instance
  # ---------------------------------------------------------------------------
  redis-test:
    image: redis:7-alpine
    container_name: wsflows-redis-test
    ports:
      - '6381:6379'
    tmpfs:
      - /data # Use RAM for faster tests
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 10
    restart: 'no'

  # ---------------------------------------------------------------------------
  # MinIO Test Instance (for storage tests)
  # ---------------------------------------------------------------------------
  minio-test:
    image: minio/minio:latest
    container_name: wsflows-minio-test
    profiles:
      - storage # Only start with: --profile storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9002:9000'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 5s
      retries: 10
    restart: 'no'
    command: server /data

# No named volumes - use tmpfs for speed and automatic cleanup
