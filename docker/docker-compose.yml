# =============================================================================
# WS-Flows - Docker Compose for Local Development
# =============================================================================
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#
# Services:
#   - PostgreSQL: localhost:5434
#   - Redis: localhost:6380
#   - MinIO (optional): localhost:9000 (API), localhost:9001 (Console)
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wsflows-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wsflows}
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis Cache & Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wsflows-redis
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ---------------------------------------------------------------------------
  # MinIO Object Storage (Optional - for execution log externalization)
  # ---------------------------------------------------------------------------
  # Enable this service if OBJECT_STORAGE_ENABLED=true
  # Provides S3-compatible storage for large execution log data
  minio:
    image: minio/minio:latest
    container_name: wsflows-minio
    profiles:
      - storage  # Only start with: docker compose --profile storage up -d
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
